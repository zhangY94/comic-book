name: Verify aggregate Android flow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Build emulator test APKs
        if: success()
        env:
          TEST_CATALOG: ${{ secrets.AGGREGATE_TEST_CATALOG }}
        run: |
          if [ -n "$TEST_CATALOG" ]; then
            ./gradlew assembleDebug assembleDebugAndroidTest -Pinclude-telemetry=false
          fi
      - name: Verify one-address aggregation on Android
        if: success()
        env:
          TEST_CATALOG: ${{ secrets.AGGREGATE_TEST_CATALOG }}
        timeout-minutes: 15
        run: |
          if [ -z "$TEST_CATALOG" ]; then exit 0; fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/aggregate-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          mkdir -p smoke-results
          trap 'cp "$RUNNER_TEMP/emulator.log" smoke-results/emulator.log 2>/dev/null || true' EXIT
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd --force -n aggregate-test -k 'system-images;android-35;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd aggregate-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          timeout 180 adb wait-for-device || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          for i in $(seq 1 120); do
            if adb shell getprop sys.boot_completed | grep -q 1; then break; fi
            sleep 2
          done
          kill -0 "$emulator_pid"
          adb shell getprop sys.boot_completed | grep -q 1
          adb shell input keyevent 82
          adb install app/build/outputs/apk/debug/app-x86_64-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e catalog "$TEST_CATALOG" -e class eu.kanade.tachiyomi.AggregateSubscriptionTest io.github.zhangy94.comicbook.dev.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/aggregate-test.txt"
          grep -q 'OK (1 test)' "$RUNNER_TEMP/aggregate-test.txt"
          mkdir -p smoke-results
          adb pull /sdcard/Android/data/io.github.zhangy94.comicbook.dev/files/aggregate-smoke/. smoke-results/
          adb logcat -d -s AndroidRuntime:E > smoke-results/crash-log.txt
      - name: Upload Android verification screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aggregate-android-verification
          path: smoke-results/
          if-no-files-found: ignore
