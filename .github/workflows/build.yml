name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Test and verify migrations
        run: ./gradlew testDebugUnitTest verifySqlDelightMigration -Pinclude-telemetry=false
      - name: Restore signing identity
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'Configure the signing secrets before building an installable APK.'; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/comic-book.p12"
          chmod 600 "$RUNNER_TEMP/comic-book.p12"
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleRelease -Pdist=foss -Pinclude-telemetry=false -Penable-updater=false
        env:
          MIHON_GITHUB_RELEASE: 'true'
          storeFile: ${{ runner.temp }}/comic-book.p12
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Record APK checksums
        if: github.event_name != 'pull_request'
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: comic-book-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports
          path: '**/build/reports/tests/'
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/comic-book.p12"
